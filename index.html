<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balloon Pop</title><style>body{margin:0;padding:12px;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;background:#fff4d6;color:#243b6b;text-align:center}h1{margin:6px;font-size:clamp(26px,5vw,40px)}#info{font-size:clamp(24px,5vw,36px);min-height:56px;font-weight:700;color:#d9480f}.n{font:inherit;font-size:20px;padding:10px 22px;border-radius:20px;border:0;background:#ff922b;color:#fff;cursor:pointer;margin:6px}#b{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:760px;margin:14px auto}.b{width:clamp(78px,20vw,110px);height:clamp(92px,23vw,128px);border:0;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;font:inherit;font-weight:700;font-size:clamp(18px,4.5vw,26px);color:#fff;cursor:pointer;animation:f 2.4s ease-in-out infinite}.b.p{animation:p .3s forwards}@keyframes f{50%{transform:translateY(-10px)}}@keyframes p{to{transform:scale(1.6);opacity:0;visibility:hidden}}</style><h1>🎈 Balloon Pop</h1><div id="info"></div><div id="b"></div><button class="n" onclick="start()">Fill the sky again</button><script>const say=w=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.replace(/-/g,""));u.lang="en-US";u.rate=.7;speechSynthesis.speak(u)};const dots=w=>w.replace(/-/g," · ");const W="A,And,A-way,Big,Blue,Can,Come,Down,Find,For,Fun-ny,Go,Help,Here,I,In,Is,It,Jump,Lit-tle,Look,Make,Me".split(","),shuf=a=>[...a].sort(()=>Math.random()-.5),$=id=>document.getElementById(id);const C=["#c92a2a","#1971c2","#2f9e44","#d9480f","#9c36b5","#0c8599"];let left;
function start(){$("b").innerHTML="";left=W.length;$("info").textContent="Pop a balloon to hear the word!";shuf(W).forEach((w,k)=>{const b=document.createElement("button");b.className="b";b.style.background=C[k%6];b.style.animationDelay=(k%5)*.3+"s";b.textContent=w.replace(/-/g,"");b.onclick=()=>{if(b.classList.contains("p"))return;b.classList.add("p");say(w);$("info").textContent=dots(w)+"  "+"👏".repeat(w.split("-").length);if(--left==0)setTimeout(()=>$("info").textContent="🎉 All 23 words popped!",1800)};$("b").append(b)})}
start()</script>
